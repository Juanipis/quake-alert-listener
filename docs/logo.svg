<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Pulse Wave Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Radar Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Concentric Radar / Seismic Radii -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="75" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Epicenter Glow Core -->
  <circle cx="256" cy="256" r="18" fill="#22c55e" filter="url(#glow)" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />

  <!-- Dynamic Seismic Waveform (P-Wave & S-Wave Signature) -->
  <path d="M 64 256 
           L 150 256 
           L 170 235 
           L 190 275 
           L 210 256 
           L 230 256 
           L 242 160 
           L 256 340 
           L 272 130 
           L 288 380 
           L 304 220 
           L 320 280 
           L 336 256 
           L 448 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Top Status Beacon -->
  <circle cx="410" cy="102" r="10" fill="#22c55e" filter="url(#glow)" />
  <circle cx="410" cy="102" r="5" fill="#ffffff" />
</svg>
