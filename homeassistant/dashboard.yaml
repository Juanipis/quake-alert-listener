# ==============================================================================
# Lovelace Dashboard Card for Home Assistant
# Paste into any dashboard view or manual card
# ==============================================================================

type: vertical-stack
cards:
  - type: heading
    heading: Earthquake Monitor
    icon: mdi:earthquake

  - type: entities
    title: Bridge
    entities:
      - entity: binary_sensor.quake_listener_online
        name: Bridge online
      - entity: sensor.quake_listener_feeds_online
        name: Feeds connected
      - entity: sensor.quake_listener_location
        name: Base station
      - entity: sensor.quake_listener_last_quake
        name: Last notified quake

  - type: entities
    title: Google MCS (experimental research)
    state_color: true
    entities:
      - entity: binary_sensor.quake_listener_mcs_link
        name: TLS link
      - entity: sensor.quake_listener_latency
        name: Heartbeat round-trip
      - entity: sensor.quake_listener_pings
        name: Heartbeats acknowledged
      - entity: sensor.quake_listener_hardware_id
        name: Anonymous device ID

  - type: horizontal-stack
    cards:
      - type: button
        name: Test Safety Drill
        icon: mdi:alarm-light
        tap_action:
          action: perform-action
          perform_action: rest_command.quake_drill
      - type: button
        name: MCS Ping Test
        icon: mdi:satellite-uplink
        tap_action:
          action: perform-action
          perform_action: rest_command.quake_ping_test
